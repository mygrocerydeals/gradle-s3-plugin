name: Bug report
description: Report something that does not work as documented
labels: ["bug"]
body:
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "3.0.4"
    validations:
      required: true
  - type: input
    id: gradle-version
    attributes:
      label: Gradle version
      placeholder: "9.4.1"
    validations:
      required: true
  - type: input
    id: jdk
    attributes:
      label: JDK vendor and version
      placeholder: "Amazon Corretto 21"
    validations:
      required: true
  - type: textarea
    id: build-script
    attributes:
      label: Minimal build script
      description: The smallest `build.gradle` (or `build.gradle.kts`) that shows the problem. Remove credentials and bucket names you do not want to share.
      render: groovy
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of the failing task run with `--stacktrace` (and `-i` for transfer details).
      render: shell
